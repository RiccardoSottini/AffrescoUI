<!doctype html>
<!-- The Studio in a tab (web/README.md, "The Studio"): it connects to a host's remote-peer server, never to a local
     socket. The token goes from the form to the Studio's memory, and leaves it only as the connection's first message. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https: wss: ws://127.0.0.1:* ws://localhost:*; img-src 'self' data: blob:; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Studio · AffrescoUI</title>
<link rel="stylesheet" href="site.css">
<script src="site.js" defer></script>
</head>
<body data-program="affrescoui_host" data-folder="studio" data-screen="studio">
<header>
<h1>Studio</h1>
<a href="index.html">All templates</a>
<form id="connect" autocomplete="off">
<label for="address">Host</label>
<input id="address" name="address" type="url" placeholder="wss://host.example:7420" required spellcheck="false">
<label for="token">Token</label>
<input id="token" name="token" type="password" autocomplete="off" required spellcheck="false">
<button type="submit">Connect</button>
</form>
</header>
<div id="canvas-container"><canvas id="canvas" tabindex="0" aria-label="AffrescoUI Studio"></canvas></div>
<footer id="status">Loading…</footer>
</body>
</html>
