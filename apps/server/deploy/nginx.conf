# The document server (apps/server) or any host's remote peers behind TLS, with nginx (SECURITY.md, "Remote peers").
#
# The server listens on the loopback only (affrescoui_server --folder DIR, which listens on 127.0.0.1:7420), and nginx
# terminates TLS in front of it and passes the WebSocket upgrade through. Peers connect to wss://example.com/live with
# their token ("Authorization: Bearer <token>" on the upgrade, or a first message {"type": "auth", "token": "<token>"}).
# Replace example.com and the certificate paths with your own; nothing here is a secret.
#
# The server sees every connection as coming from nginx, so its per-address rate limit applies to the proxy as a whole:
# set PeerServerOptions::connectionsPerSecond and connectionBurst with that in mind, or rate-limit here (limit_conn).

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 off; # WebSocket upgrades are HTTP/1.1
	server_name example.com;

	ssl_certificate     /etc/ssl/example.com/fullchain.pem;
	ssl_certificate_key /etc/ssl/example.com/privkey.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;

	location / {
		proxy_pass http://127.0.0.1:7420;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_read_timeout 1h; # a live document stays connected
		proxy_buffering off;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name example.com;
	return 301 https://$host$request_uri;
}
