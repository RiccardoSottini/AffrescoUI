# Builds the downloads: the host (which opens the Launcher) and the affrescoui tool for macOS (one universal binary for arm64 and
# x86_64), Linux (x86_64) and Windows (x86_64), plus the MCP server's Python package; then checks each
# archive on a clean machine of its system, with no source tree there.
#
# - A pushed tag v* (only the maintainer pushes tags) also makes a draft GitHub Release with the archives, SHA256SUMS,
#   the SBOM and build-provenance attestations; the MCP package's wheel and sdist, the VS Code extension (.vsix), the
#   web build and the docs site (zips), the AppImage and the package recipes (packages-<version>.zip) are release
#   assets too. EVERYTHING lives only in that draft, which the maintainer reviews and publishes: no
#   PyPI, marketplace, Pages, CDN, registry, tap or package index is ever touched.
# - workflow_dispatch, and a pull request that changes the release files, are dry runs: everything is built, packed
#   and checked, and the files are kept as this run's artifacts; nothing is released or published.
# - Signing (RELEASING.md): the macOS programs, AffrescoUI.app and its disk image are signed with a Developer ID,
#   notarized and stapled; the Windows programs are signed through SignPath; a tag's every release file gets a Sigstore
#   bundle (keyless, through this run's identity). A platform whose secrets aren't all set is built unsigned, and the
#   Signing job's summary says which secret is missing; a pull request is never signed; a tag that would be unsigned
#   fails, unless the repository variable RELEASE_UNSIGNED_PLATFORMS names the platform (tools/release/check_signing.py).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/release/**
      - mcp/pyproject.toml

permissions: {} # each job asks for what it needs

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The same version everywhere, and the tag's
        id: check
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(python3 tools/release/check_version.py ${TAG:+--tag "$TAG"})
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Which platforms this run signs, from which secrets are set (never their values): the other jobs follow it
  signing:
    name: Signing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      macos: ${{ steps.decide.outputs.macos }}
      windows: ${{ steps.decide.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The decision's tests
        run: python3 -m unittest discover -s tools/release -p "test_check_signing.py"
      - name: Which platforms are signed # a tag that would be unsigned fails here
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          UNSIGNED_PLATFORMS: ${{ vars.RELEASE_UNSIGNED_PLATFORMS }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY != '' }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID != '' }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID != '' }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG != '' }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
        run: python3 tools/release/check_signing.py

  binaries:
    name: Binaries (${{ matrix.platform }})
    needs: [version, signing]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180 # notarization, and SignPath's approval, are waited for
    permissions:
      contents: read
      actions: read # SignPath downloads the unsigned Windows programs, this run's artifact, with this job's token
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-universal
            system: macos
            runner: macos-latest
            configure: -G Ninja "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
          - platform: linux-x86_64
            system: linux
            runner: ubuntu-24.04
            configure: -G Ninja
          - platform: windows-x86_64
            system: windows
            runner: windows-latest
            configure: -A x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev libwayland-dev libxkbcommon-dev wayland-protocols libssl-dev
      - name: Build # Release, without the tests: the CI workflow tests every commit
        shell: bash
        run: |
          cmake -S . -B build ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release -DAFFRESCOUI_BUILD_TESTS=OFF
          cmake --build build --config Release --target affrescoui_launcher affrescoui_cli
      # macOS: the certificate in a keychain of the job's own (deleted at the end), then both programs signed with the
      # hardened runtime and a timestamp; they are notarized below, with the app (tools/release/macos.sh)
      - name: Import the Developer ID certificate (macOS)
        if: runner.os == 'macOS' && needs.signing.outputs.macos == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: tools/release/macos.sh import-certificate
      - name: Sign the programs (macOS)
        if: runner.os == 'macOS' && needs.signing.outputs.macos == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: tools/release/macos.sh sign build/affrescoui build/affrescoui_launcher
      # Windows: SignPath signs the programs this run uploads (its artifact configuration names them), and hands
      # them back; the signing policy may wait for the maintainer's approval in SignPath
      - name: The programs to sign (Windows)
        id: unsigned
        if: runner.os == 'Windows' && needs.signing.outputs.windows == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signpath-unsigned-windows
          path: |
            build/Release/affrescoui_launcher.exe
            build/Release/affrescoui.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign them with SignPath (Windows)
        if: runner.os == 'Windows' && needs.signing.outputs.windows == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: | # the artifact configuration checks the programs' product version against it (RELEASING.md)
            version: "${{ needs.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200 # time for the approval
          output-artifact-directory: ${{ runner.temp }}/signed
      - name: Put the signed programs in place, and check them (Windows)
        if: runner.os == 'Windows' && needs.signing.outputs.windows == 'true'
        shell: pwsh
        env:
          SIGNED: ${{ runner.temp }}/signed
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Output "::error::signtool.exe isn't on this runner"; exit 1 }
          foreach ($program in 'affrescoui_launcher.exe', 'affrescoui.exe') {
            $file = Get-ChildItem -Path $env:SIGNED -Recurse -Filter $program | Select-Object -First 1
            if (-not $file) { Write-Output "::error::SignPath gave back no $program"; exit 1 }
            Copy-Item $file.FullName "build/Release/$program" -Force
            $signature = Get-AuthenticodeSignature "build/Release/$program"
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
              Write-Output "::error::$program isn't signed and timestamped: $($signature.Status) $($signature.StatusMessage)"; exit 1
            }
            Write-Output "$program signed by $($signature.SignerCertificate.Subject)"
            & $signtool.FullName verify /pa /tw "build/Release/$program"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Pack
        shell: bash
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          SIGNED: ${{ needs.signing.outputs[matrix.system] == 'true' && '--signed' || '' }}
          APP: ${{ runner.os == 'macOS' && format('--app={0}/app', runner.temp) || '' }}
        run: $PYTHON tools/release/package.py --build build --platform ${{ matrix.platform }} --out dist $SIGNED $APP
      # AffrescoUI.app (the Launcher) in a disk image. Signed: the app, and both programs of the archive, notarized in
      # one submission and the app stapled; then the image made, signed, notarized and stapled, so both open with no
      # warning, offline too. Unsigned: the same, signed ad hoc, with no notarization.
      - name: The app and its disk image (macOS)
        if: runner.os == 'macOS'
        env:
          NOTARIZE: ${{ needs.signing.outputs.macos }}
          SIGNING_IDENTITY: ${{ needs.signing.outputs.macos == 'true' && secrets.MACOS_SIGNING_IDENTITY || '-' }}
          APPLE_API_KEY_P8: ${{ needs.signing.outputs.macos == 'true' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ needs.signing.outputs.macos == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ needs.signing.outputs.macos == 'true' && secrets.APPLE_API_ISSUER_ID || '' }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          app="$RUNNER_TEMP/app/AffrescoUI.app"
          image="dist/AffrescoUI-$VERSION-macos-universal.dmg"
          tools/release/macos.sh sign "$app"
          if [ "$NOTARIZE" = true ]; then
            tools/release/macos.sh zip "$RUNNER_TEMP/notarize.zip" "$app" build/affrescoui build/affrescoui_launcher
            tools/release/macos.sh notarize "$RUNNER_TEMP/notarize.zip"
            tools/release/macos.sh staple "$app"
          fi
          tools/release/macos.sh dmg "$app" "$image" "AffrescoUI $VERSION"
          tools/release/macos.sh sign "$image"
          if [ "$NOTARIZE" = true ]; then
            tools/release/macos.sh notarize "$image"
            tools/release/macos.sh staple "$image"
          fi
          notarized=""
          if [ "$NOTARIZE" = true ]; then notarized=--notarized; fi
          tools/release/macos.sh verify "$app" "$image" build/affrescoui build/affrescoui_launcher $notarized
      - name: Delete the keychain (macOS)
        if: always() && runner.os == 'macOS' && needs.signing.outputs.macos == 'true'
        run: tools/release/macos.sh delete-keychain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  python:
    name: MCP server package
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build # with the pinned build tools only (tools/release/requirements.txt)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r tools/release/requirements.txt
          .venv/bin/python tools/release/build_mcp.py --out dist
      - name: Install and start it
        run: |
          python3 -m venv /tmp/installed
          /tmp/installed/bin/pip install dist/*.whl
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | /tmp/installed/bin/affrescoui-mcp | grep -q '"serverInfo"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  # Each archive on a machine of its system without the source tree, so the programs must find their assets next to
  # themselves, as on a user's machine; the macOS disk image's app, in its bundle. When the platform was signed, the
  # signatures are checked again here, on the files as downloaded.
  verify:
    name: Check the download (${{ matrix.platform }})
    needs: [signing, binaries]
    runs-on: ${{ matrix.runner }}
    permissions: {}
    env:
      SIGNED: ${{ needs.signing.outputs[matrix.system] == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-universal, system: macos, runner: macos-latest }
          - { platform: linux-x86_64, system: linux, runner: ubuntu-24.04 }
          - { platform: windows-x86_64, system: windows, runner: windows-latest }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-${{ matrix.platform }}
      - name: Unpack
        shell: bash
        run: |
          for archive in affrescoui-*; do
            case "$archive" in *.zip) unzip -q "$archive" ;; *) tar -xzf "$archive" ;; esac
          done
          ls -d affrescoui-*/
      - name: What the archive holds # the programs, every app's folder, the fonts and the notices
        shell: bash
        run: |
          cd affrescoui-*/
          for file in LICENSE NOTICE THIRD_PARTY_NOTICES.md README.txt assets/SCREEN_FORMAT.md; do test -s "$file"; done
          ls assets/shared/fonts/*.ttf > /dev/null
          ls -d assets/*/app.json
          test -f assets/launcher/app.json
      - name: The tool runs and checks every app
        shell: bash
        run: |
          cd affrescoui-*/
          ./affrescoui --version
          for app in assets/*/app.json; do ./affrescoui check "$(dirname "$app")"; done
          for screen in assets/*/*.screen.json; do ./affrescoui check "$screen"; done
      - name: Universal (macOS)
        if: runner.os == 'macOS'
        run: |
          cd affrescoui-*/
          for program in affrescoui affrescoui_launcher; do lipo "$program" -verify_arch arm64 x86_64; done
      - name: Signed and notarized (macOS) # a program on its own can't be stapled: Apple is asked online
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        run: |
          cd affrescoui-*/
          for program in affrescoui affrescoui_launcher; do
            codesign --verify --strict --verbose=2 "$program"
            codesign --display --verbose=2 "$program" 2>&1 | grep "^Authority=Developer ID Application"
            codesign --verify --strict --check-notarization -R="notarized" --verbose=2 "$program"
          done
      - name: Product name and version (Windows) # what Explorer shows, and what code signing checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $folder = Get-ChildItem -Directory -Filter 'affrescoui-*' | Select-Object -First 1
          $version = $folder.Name.Split('-')[1]
          foreach ($program in 'affrescoui_launcher.exe', 'affrescoui.exe') {
            $info = (Get-Item (Join-Path $folder.FullName $program)).VersionInfo
            if ($info.ProductName -ne 'AffrescoUI' -or $info.ProductVersion -ne $version) {
              Write-Output "::error::$program says $($info.ProductName) $($info.ProductVersion), not AffrescoUI $version"; exit 1
            }
          }
      - name: Signed (Windows)
        if: runner.os == 'Windows' && env.SIGNED == 'true'
        shell: pwsh
        run: |
          $folder = Get-ChildItem -Directory -Filter 'affrescoui-*' | Select-Object -First 1
          foreach ($program in 'affrescoui_launcher.exe', 'affrescoui.exe') {
            $signature = Get-AuthenticodeSignature (Join-Path $folder.FullName $program)
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
              Write-Output "::error::$program isn't signed and timestamped: $($signature.Status)"; exit 1
            }
            Write-Output "$program signed by $($signature.SignerCertificate.Subject)"
          }
      # The disk image: what it holds, its app's signature (and, signed, Gatekeeper's verdict and the stapled tickets),
      # and the app drawing the Launcher from inside the mounted image, with the assets in its bundle
      - name: The disk image and its app (macOS)
        if: runner.os == 'macOS'
        env:
          AFFRESCOUI_DATA_DIR: ${{ runner.temp }}/data-app
          AFFRESCOUI_SOCKET_DIR: ${{ runner.temp }}/s-app
        run: |
          image="$(ls AffrescoUI-*-macos-universal.dmg)"
          mount="$RUNNER_TEMP/image"
          mkdir -p "$mount"
          codesign --verify --strict --verbose=2 "$image"
          if [ "$SIGNED" = true ]; then
            spctl --assess --type open --context context:primary-signature --verbose=4 "$image"
            xcrun stapler validate "$image"
          fi
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$image"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/AffrescoUI.app"
          test -L "$mount/Applications"
          for file in Info.plist MacOS/affrescoui_launcher Resources/AffrescoUI.icns Resources/NOTICE \
                      Resources/assets/launcher/app.json Resources/assets/SCREEN_FORMAT.md; do
            test -e "$app/Contents/$file"
          done
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$(echo "$image" | cut -d- -f2)"
          lipo "$app/Contents/MacOS/affrescoui_launcher" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$SIGNED" = true ]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi
          AFFRESCOUI_SCREENSHOT="$RUNNER_TEMP/app.ppm" "$app/Contents/MacOS/affrescoui_launcher"
          test -s "$RUNNER_TEMP/app.ppm"
      - name: Xvfb and Mesa's software OpenGL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
      # Every app opens from its folder, as a person would open it, and draws its first frame from the archive's own
      # assets; then the Launcher, opened with no file, lists them. Windows runners have no OpenGL 4.1, so there the
      # check above (each app loaded whole, without a window) is what runs.
      - name: Every app draws its first frame, and the Launcher opens (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          AFFRESCOUI_DATA_DIR: ${{ runner.temp }}/data
          AFFRESCOUI_SOCKET_DIR: ${{ runner.temp }}/s
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.1"
        run: |
          on_display() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1920x1080x24" "$@"; else "$@"; fi; }
          cd affrescoui-*/
          mkdir -p frames
          for app in assets/*/app.json; do
            folder="$(dirname "$app")"
            name="$(basename "$folder")"
            AFFRESCOUI_SCREENSHOT="frames/$name.ppm" on_display ./affrescoui_launcher "$folder"
            test -s "frames/$name.ppm" || { echo "::error::$name drew no frame"; exit 1; }
          done
          AFFRESCOUI_SCREENSHOT=frames/launcher-without-a-file.ppm on_display ./affrescoui_launcher
          test -s frames/launcher-without-a-file.ppm
          on_display ./affrescoui render assets/flow/index.screen.json -o frames/kanban.png
          test -s frames/kanban.png

  vscode:
    name: VS Code extension
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the devDependencies (lockfile, no scripts)
        working-directory: editors/vscode
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package
        working-directory: editors/vscode
        run: npm run package
      - name: Name it for the release
        run: |
          mkdir -p dist
          cp editors/vscode/affrescoui.vsix "dist/affrescoui-vscode-$VERSION.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-vscode
          path: dist/*
          if-no-files-found: error

  web:
    name: Web build
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      EMSDK_VERSION: "6.0.10" # AFFRESCOUI_EMSDK_VERSION in cmake/AffrescoUIWeb.cmake
      EMSDK_COMMIT: d7b4130688bfa348392b921ab04015aa15c4f154 # emsdk's own scripts, pinned (as web.yml)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: Install emsdk
        run: |
          git clone --filter=blob:none https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout --detach "$EMSDK_COMMIT"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Build the site
        run: |
          # shellcheck disable=SC1091 # emsdk's environment
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          tools/web/build.sh
      - name: Zip it
        run: |
          mkdir -p dist
          (cd build-web/site && zip -qr "$GITHUB_WORKSPACE/dist/affrescoui-web-$VERSION.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-web
          path: dist/*
          if-no-files-found: error

  site:
    name: Docs site
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: doxygen python3-venv
          cache: site
      - name: Build the affrescoui tool
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target affrescoui -j 4
      - name: Build the site (strict)
        run: website/build.sh
      - name: Zip it
        run: |
          mkdir -p dist
          (cd website/build/site && zip -qr "$GITHUB_WORKSPACE/dist/affrescoui-site-$VERSION.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-site
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [version, signing, binaries, python, verify, vscode, web, site, packages, winget]
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # the draft release
      id-token: write     # signing the attestations, and the Sigstore signatures
      attestations: write # storing them
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: "{binaries-*,python-package,asset-*}" # the release's files, not the dry-run folders
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source # the manifest the SBOM is made from; dist keeps only what the release carries
          persist-credentials: false
      - name: Software bill of materials # SPDX 2.3, from cmake/dependencies.json, checked first; attached and attested with the rest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 source/tools/release/sbom.py --check
          SOURCE_DATE_EPOCH="$(git -C source log -1 --format=%ct)" \
            python3 source/tools/release/sbom.py --sbom "dist/affrescoui-$VERSION.spdx.json"
      - name: Source tarball # what the recipes of packaging/ build from
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: git -C source archive --format=tar.gz --prefix="affrescoui-$VERSION/" -o "$PWD/dist/affrescoui-$VERSION-source.tar.gz" HEAD
      - name: Checksums # of the final files: signed, notarized and stapled
        working-directory: dist
        run: sha256sum affrescoui* AffrescoUI-* packages-* > SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sigstore signatures # a <file>.sigstore.json for every file, SHA256SUMS too; then each one checked
        run: |
          source/tools/release/sigstore.sh sign dist
          source/tools/release/sigstore.sh verify dist "https://github.com/$GITHUB_WORKFLOW_REF"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Draft the release # the maintainer reads it and publishes it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          MACOS_SIGNED: ${{ needs.signing.outputs.macos }}
          WINDOWS_SIGNED: ${{ needs.signing.outputs.windows }}
        run: |
          macos="macOS with a Developer ID, notarized"
          windows="Windows through SignPath"
          if [ "$MACOS_SIGNED" != true ]; then macos="macOS NOT signed (RELEASE_UNSIGNED_PLATFORMS)"; fi
          if [ "$WINDOWS_SIGNED" != true ]; then windows="Windows NOT signed (RELEASE_UNSIGNED_PLATFORMS)"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "AffrescoUI $VERSION" \
            --notes "Downloads for macOS (universal: AffrescoUI-$VERSION-macos-universal.dmg, the app, and the archive with the command-line tool), Linux (x86_64) and Windows (x86_64), the AppImage, the VS Code extension (.vsix), the web build and the docs site (zips), and the package recipes (packages-$VERSION.zip, for you to use yourself). Signed: $macos; $windows; every file has a Sigstore bundle (<file>.sigstore.json). Check them with \`sha256sum -c SHA256SUMS\`, \`cosign verify-blob --bundle <file>.sigstore.json --certificate-identity https://github.com/$GITHUB_WORKFLOW_REF --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>\` and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\` (SECURITY.md, \"How releases are signed\"). The MCP server installs from the release's wheel (\`pipx install ./affrescoui_mcp-$VERSION-py3-none-any.whl\`) or from GitHub (\`pipx install \"git+https://github.com/$GITHUB_REPOSITORY#subdirectory=mcp\"\`)." \
            dist/*

  # The recipes of packaging/, filled in for this run's files and tried out: the AppImage is built and started, the
  # winget manifests validated. The recipes (zipped) and the AppImage become release assets on a tag; nothing is
  # submitted or published anywhere.
  packages:
    name: Packages
    needs: [version, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Source tarball and checksums # as the release job makes them
        run: |
          git archive --format=tar.gz --prefix="affrescoui-$VERSION/" -o "dist/affrescoui-$VERSION-source.tar.gz" HEAD
          (cd dist && sha256sum affrescoui* > SHA256SUMS && cat SHA256SUMS)
      - name: Fill in the recipes
        run: |
          python3 tools/release/packaging.py --check
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            python3 tools/release/packaging.py --version "$VERSION" --sums dist/SHA256SUMS --out dist/packages
          for recipe in appimage conan homebrew vcpkg winget; do test -d "dist/packages/$recipe"; done
      - name: AppImage # with appimagetool 1.9.1 and type2-runtime 20251108, pinned in cmake/dependencies.json
        run: |
          mkdir -p appimage/tools appimage/archive
          curl -fsSL -o appimage/tools/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o appimage/tools/runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          printf '%s\n' \
            "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimage/tools/appimagetool" \
            "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  appimage/tools/runtime-x86_64" \
            | sha256sum -c
          chmod +x appimage/tools/appimagetool
          tar -xzf "dist/affrescoui-$VERSION-linux-x86_64.tar.gz" -C appimage/archive
          sh dist/packages/appimage/build.sh "appimage/archive/affrescoui-$VERSION-linux-x86_64" \
            appimage/tools/appimagetool appimage/tools/runtime-x86_64 dist
          "./dist/AffrescoUI-$VERSION-x86_64.AppImage" --appimage-extract-and-run affrescoui --version
          # It holds what the archive holds: every app's folder and the notices
          (cd appimage && "../dist/AffrescoUI-$VERSION-x86_64.AppImage" --appimage-extract > /dev/null)
          diff <(cd "appimage/archive/affrescoui-$VERSION-linux-x86_64/assets" && ls -d */app.json) \
            <(cd appimage/squashfs-root/usr/bin/assets && ls -d */app.json)
          for file in LICENSE NOTICE THIRD_PARTY_NOTICES.md; do test -s "appimage/squashfs-root/usr/share/doc/affrescoui/$file"; done
          ls appimage/squashfs-root/usr/bin/assets/shared/fonts/*.ttf > /dev/null
      - name: Zip the recipes
        run: (cd dist && zip -qr "packages-$VERSION.zip" packages)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-packages
          path: |
            dist/packages-*.zip
            dist/AffrescoUI-*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/packages
            dist/AffrescoUI-*.AppImage
          if-no-files-found: error

  winget:
    name: Packages (winget validate)
    needs: packages
    runs-on: windows-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - name: Validate the manifests
        run: winget validate --manifest packages/winget

  # A manual run tries the Sigstore steps the release takes, on the Linux archive: signed through this run's identity
  # (the branch's), then checked. The bundle is kept as this run's artifact; nothing is released.
  sigstore:
    name: Sigstore (manual run)
    if: github.event_name == 'workflow_dispatch'
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the run's identity, which signs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-linux-x86_64
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign and check
        run: |
          source/tools/release/sigstore.sh sign dist
          source/tools/release/sigstore.sh verify dist "https://github.com/$GITHUB_WORKFLOW_REF"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sigstore-dry-run
          path: dist/*.sigstore.json
          if-no-files-found: error
