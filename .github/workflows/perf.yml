# Measures every pull request against its base on the same runner (tests/perf/ci.sh): instructions per operation under
# callgrind for the workloads that don't draw, the frames' CPU time, allocations, memory and tokens. The job summary
# has the tables. It fails if a workload's instruction count grows by more than 3%, unless the pull request has the
# perf-change label, which only the maintainer adds: that is how an intended slowdown passes.
name: Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled] # adding or removing perf-change reruns the comparison

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: Benchmarks (callgrind)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: "1" # Mesa's llvmpipe, under Xvfb
      MESA_GL_VERSION_OVERRIDE: "4.1"
      PERF_BASE: HEAD^1 # the merge commit's first parent: the base branch
      PERF_ALLOW: ${{ contains(github.event.pull_request.labels.*.name, 'perf-change') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and its base
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build valgrind xvfb xauth libgl1-mesa-dri \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols python3-venv
          # tiktoken, for tests/perf/tokens.py only, in its own environment (the system's Python is managed by apt),
          # with what it needs, each file checked against its hash
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r tests/perf/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Measure base and head
        run: xvfb-run -a -s "-screen 0 1920x1080x24" tests/perf/ci.sh
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: ${{ runner.temp }}/perf/
