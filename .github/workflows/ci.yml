# Builds on Linux, macOS and Windows, runs the unit tests (tests/unit), and runs the rendering check (tests/render)
# where OpenGL is available. The check compares each frame with golden images recorded from the base commit on the
# same runner (render-check.sh); a frame that differs is uploaded with its diff image as the "render-check-*" artifact.
# On a pull request labelled visual-change, the check records the frames instead and uploads all of them: that is how
# an intended change in the pictures passes.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled] # adding or removing visual-change reruns the check
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1" # Mesa's llvmpipe, under Xvfb
      MESA_GL_VERSION_OVERRIDE: "4.1"
      # The commit the golden images are recorded from: the merge commit's first parent, or the commit before the push
      RENDER_CHECK_BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
      RENDER_CHECK_RECORD: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base can be several commits back (a push of several commits)
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb xauth libgl1-mesa-dri \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build
      - name: Unit tests
        run: ctest --test-dir build -R unit --output-on-failure
      - name: Rendering check
        run: xvfb-run -a -s "-screen 0 1920x1080x24" .github/workflows/render-check.sh
      - name: Upload the frames # the differing ones and their diffs, or all recorded ones (visual-change)
        if: failure() || env.RENDER_CHECK_RECORD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-check-linux
          path: |
            build/render-check/*.png
            tests/render/golden/

  sanitizers:
    name: Linux (address + undefined sanitizers)
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_GL_VERSION_OVERRIDE: "4.1"
      RENDER_CHECK_BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
      RENDER_CHECK_RECORD: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
      SANITIZE: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
      # Links the GLX library GLFW loads, so glfwTerminate() can't unload it, nor Mesa's driver behind it, before the
      # leak report: what the driver keeps until exit stays reachable, and isn't reported as a leak
      KEEP_GL: -Wl,--no-as-needed -l:libGLX.so.0 -Wl,--as-needed
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/workflows/lsan.supp # empty for now, see the file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb xauth libgl1-mesa-dri \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            "-DCMAKE_C_FLAGS=$SANITIZE" "-DCMAKE_CXX_FLAGS=$SANITIZE" "-DCMAKE_EXE_LINKER_FLAGS=$SANITIZE $KEEP_GL"
          cmake --build build
      - name: Unit tests
        run: ctest --test-dir build -R unit --output-on-failure
      - name: Rendering check
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" .github/workflows/render-check.sh -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_C_FLAGS=$SANITIZE" "-DCMAKE_CXX_FLAGS=$SANITIZE" "-DCMAKE_EXE_LINKER_FLAGS=$SANITIZE $KEEP_GL"
      - name: Upload the frames
        if: failure() || env.RENDER_CHECK_RECORD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-check-sanitizers
          path: |
            build/render-check/*.png
            tests/render/golden/

  # Builds and runs the unit tests (the job keeps its name, which branch protection may require). The macOS runners
  # are virtual machines without a GPU, and GLFW asks macOS for a hardware-accelerated OpenGL pixel format, so no
  # window gets a context ("NSGL: Failed to find a suitable pixel format") and the rendering check can't run. Linux
  # runs it instead.
  macos:
    name: macOS (build only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: brew install ninja
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build
      - name: Unit tests
        run: ctest --test-dir build -R unit --output-on-failure

  windows:
    name: Windows (not supported yet)
    runs-on: windows-latest
    continue-on-error: true # Windows support is roadmap item 1.1: its errors show here without failing CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build --config Release
