# Every check of a pull request and of master, in a few jobs that each build once and run all that build can
# (.github/workflows/README.md has the jobs, what each checks, and how to run each check locally):
# - Changes: whether the change needs a build at all (prose alone doesn't; the build jobs are then skipped);
# - Linux: GCC; the unit, window, CLI, MCP and scenario tests, the rendering check, the package check, the API
#   reference, and the quality gate (clang-tidy on the changed lines, function size);
# - Linux (address + undefined sanitizers): GCC with ASan and UBSan: the tests and the rendering check;
# - Fuzz, on pull requests: every fuzz target for 60 s, one after the other, from the nightly corpus;
# - macOS (build only); Windows: MSVC, the unit tests, the scenarios and the CLI's tests, headless;
# - Benchmarks (callgrind), on pull requests: base and head on the same runner;
# - Quality report, on master: the whole repository and the coverage of the unit tests.
#
# The rendering check and the benchmarks compare with the base commit, built on the same runner. The visual-change
# label makes the rendering check record the frames instead, and perf-change lets the benchmarks grow: only the
# maintainer adds them, and adding or removing one runs the checks again. The long fuzz runs are nightly (nightly.yml).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled] # a label decides how the rendering check and the benchmarks judge
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a new push stops the run of the old one

env:
  # The commit a change is compared with: the merge commit's first parent (the base branch), or the commit before a push
  BASE_COMMIT: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
  LIBGL_ALWAYS_SOFTWARE: "1" # Mesa's llvmpipe, under Xvfb
  MESA_GL_VERSION_OVERRIDE: "4.1"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base can be several commits back (a push of several commits)
          persist-credentials: false
      - name: Does the change need a build?
        id: diff
        run: .github/workflows/changes.sh "$BASE_COMMIT"

  linux:
    name: Linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RENDER_CHECK_BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
      RENDER_CHECK_RECORD: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
      LLVM_BIN: /usr/lib/llvm-18/bin # the quality gate's clang and clang-tidy, from one release
      QUALITY_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: xvfb xauth libgl1-mesa-dri doxygen clang-18 clang-tidy-18 llvm-18 python3-venv
          cache: linux-gcc
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build
      - name: Unit tests # headless windows included
        run: ctest --test-dir build -R unit --output-on-failure
      - name: Window tests # pictures drawn with OpenGL, under Xvfb (the rest of a window runs headless, in unit)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build -R window --output-on-failure
      - name: Command-line tool and MCP queries # tools/affrescoui/check.py, mcp/test_affrescoui_mcp.py
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build -R "cli|mcp" --output-on-failure
      - name: The templates' scenarios # affrescoui test, headless: what each template does (SCREEN_FORMAT.md, "Scenarios")
        run: build/affrescoui test examples/assets/screens/*.scenarios.json
      - name: Rendering check
        run: xvfb-run -a -s "-screen 0 1920x1080x24" .github/workflows/render-check.sh
      - name: Upload the frames # the differing ones and their diffs, or all recorded ones (visual-change)
        if: failure() || env.RENDER_CHECK_RECORD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-check-linux
          path: |
            build/render-check/*.png
            tests/render/golden/
      - name: Package check # cmake --install, then find_package from tests/package; after the frames, never hiding them
        if: success() || failure()
        run: python3 tests/package/check.py
      - name: API reference # Doxyfile: WARN_AS_ERROR, so every public class, function and member stays documented
        if: success() || failure()
        run: |
          mkdir -p build/api-reference # Doxygen 1.9 creates only the last folder of OUTPUT_DIRECTORY
          doxygen Doxyfile
      - name: Upload the API reference
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-reference
          path: build/api-reference/html/
          if-no-files-found: error
      - name: Quality gate # tools/quality/README.md: the base's rules, on what the change touches
        if: (success() || failure()) && (github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000')
        run: |
          tools/quality/run.sh test
          tools/quality/run.sh gate "$BASE_COMMIT"

  sanitizers:
    name: Linux (address + undefined sanitizers)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RENDER_CHECK_BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
      RENDER_CHECK_RECORD: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
      SANITIZE: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
      # Links the GLX library GLFW loads, so glfwTerminate() can't unload it, nor Mesa's driver behind it, before the
      # leak report: what the driver keeps until exit stays reachable, and isn't reported as a leak
      KEEP_GL: -Wl,--no-as-needed -l:libGLX.so.0 -Wl,--as-needed
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/workflows/lsan.supp # empty for now, see the file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: xvfb xauth libgl1-mesa-dri
          cache: linux-gcc-sanitizers
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            "-DCMAKE_C_FLAGS=$SANITIZE" "-DCMAKE_CXX_FLAGS=$SANITIZE" "-DCMAKE_EXE_LINKER_FLAGS=$SANITIZE $KEEP_GL"
          cmake --build build
      - name: Unit tests # headless windows included
        run: ctest --test-dir build -R "unit|scenarios" --output-on-failure
      - name: Window tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build -R window --output-on-failure
      - name: Rendering check
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" .github/workflows/render-check.sh -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_C_FLAGS=$SANITIZE" "-DCMAKE_CXX_FLAGS=$SANITIZE" "-DCMAKE_EXE_LINKER_FLAGS=$SANITIZE $KEEP_GL"
      - name: Upload the frames
        if: failure() || env.RENDER_CHECK_RECORD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-check-sanitizers
          path: |
            build/render-check/*.png
            tests/render/golden/

  # Every fuzz target for 60 s, one after the other, from the nightly corpus (tests/fuzz/README.md), built as
  # nightly.yml builds them
  fuzz:
    name: Fuzz
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang-18
      CXX: clang++-18
      ASAN_SYMBOLIZER_PATH: /usr/lib/llvm-18/bin/llvm-symbolizer
      FUZZ_SECONDS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: clang-18 libclang-rt-18-dev llvm-18
          cache: linux-clang-fuzzers
      - name: Build the fuzz targets
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAFFRESCOUI_BUILD_FUZZERS=ON \
            -DAFFRESCOUI_BUILD_EXAMPLES=OFF -DAFFRESCOUI_BUILD_TESTS=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build
      - name: Restore the fuzz corpus of the nightly runs # read, never written, here
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz every target # tests/fuzz/README.md; a failing input names its target and is uploaded
        if: success() || failure()
        run: .github/workflows/fuzz.sh build "$FUZZ_SECONDS"
      - name: Upload the inputs that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-found
          path: build/fuzz-found/
          if-no-files-found: ignore

  # The macOS runners are virtual machines without a GPU, and GLFW asks macOS for a hardware-accelerated OpenGL pixel
  # format, so no window gets a context ("NSGL: Failed to find a suitable pixel format"): the tests that draw run on
  # Linux. Everything headless runs here.
  macos:
    name: macOS (build only)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: macos
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build
      - name: Unit tests and the templates' scenarios # headless
        run: ctest --test-dir build -R "unit|scenarios" --output-on-failure

  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out with the repository's line endings # the CLI's tests compare generated files with them
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build --config Release
      - name: Unit tests, the templates' scenarios and the CLI's tests # headless: the runners have no OpenGL 4.1
        run: ctest --test-dir build -C Release -R "unit|scenarios|cli" --output-on-failure

  # tests/perf/ci.sh: instructions per operation under callgrind for the workloads that don't draw, the frames' CPU
  # time, allocations, memory and tokens, base and head on this runner; the job summary has the tables. It fails if a
  # workload's instructions grow by more than 3%, unless the pull request has the perf-change label.
  benchmarks:
    name: Benchmarks (callgrind)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PERF_BASE: HEAD^1
      PERF_ALLOW: ${{ contains(github.event.pull_request.labels.*.name, 'perf-change') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and its base
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: valgrind xvfb xauth libgl1-mesa-dri python3-venv
          cache: linux-gcc-release-benchmarks
      # tiktoken, for tests/perf/tokens.py only, in its own environment (apt manages the system's Python), with what it
      # needs, each file checked against its hash
      - name: Install tiktoken
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r tests/perf/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Measure base and head
        run: xvfb-run -a -s "-screen 0 1920x1080x24" tests/perf/ci.sh
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: ${{ runner.temp }}/perf/

  # The whole repository (the longest and most complex functions, tidy findings per module) and the coverage of the
  # unit tests, on master only: 15 minutes that a pull request doesn't need. Fails only when coverage falls below the
  # floor in tools/quality/coverage-baseline.json (the base's); the numbers are in the job summary and the artifacts.
  report:
    name: Quality report
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LLVM_BIN: /usr/lib/llvm-18/bin
      QUALITY_JOBS: "4"
      QUALITY_BASE: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: clang-18 clang-tidy-18 llvm-18 python3-venv
          cache: linux-clang-coverage
      - name: Coverage of the unit tests # fails below the floor in tools/quality/coverage-baseline.json
        run: tools/quality/run.sh coverage "$QUALITY_BASE"
      - name: Whole-repository report # also when the coverage is below the floor: its numbers still help
        if: success() || failure()
        run: tools/quality/run.sh report
      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: build-quality/quality-report.json
      - name: Upload the coverage
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            build-quality/coverage/coverage.json
            build-quality/coverage/coverage.lcov
            build-quality/coverage/html/
