# The documentation site (website/README.md): builds it strictly, with every recipe checked by the affrescoui tool,
# the references generated from this commit and the C++ API reference from the Doxyfile, and uploads it as the
# artifact `site`. Nothing is deployed: the release carries the site as a zip (RELEASING.md).
name: Site

on:
  pull_request:
    paths:
      - website/**
      - schema/**
      - mcp/**
      - modules/**
      - tools/affrescoui/**
      - SCREEN_FORMAT.md
      - VERSION_CONTROL.md
      - SECURITY.md
      - Doxyfile
      - .github/workflows/site.yml
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a new push stops the run of the old one

jobs:
  site:
    name: Site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          packages: doxygen python3-venv
          cache: site
      - name: Build the affrescoui tool
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target affrescoui -j 4
      - name: Build the site (strict)
        run: website/build.sh
      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: website/build/site
          if-no-files-found: error
