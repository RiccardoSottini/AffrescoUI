# The VS Code extension (editors/vscode/README.md): installs its pinned devDependencies from the lockfile, runs its
# unit tests and packages it, and uploads the package as the artifact `vscode-extension`. Nothing is published:
# there is no publisher, token or publish step. It uses the Node.js preinstalled on the runner image.
name: VS Code extension

on:
  pull_request:
    paths:
      - editors/vscode/**
      - schema/**
      - .github/workflows/vscode.yml
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a new push stops the run of the old one

jobs:
  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the devDependencies (lockfile, no scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Package
        run: npm run package
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension
          path: editors/vscode/affrescoui.vsix
          if-no-files-found: error
