# Keeps the actions pinned by commit SHA in .github/workflows/, the editor extension's npm packages and the Python
# tools' requirements up to date
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    # The types follow the oldest VS Code the extension supports, engines.vscode in package.json: vsce refuses an
    # @types/vscode newer than it, and @types/node is the Node.js inside that VS Code (1.100: Node.js 20). Raise them
    # with engines.vscode, by hand.
    ignore:
      - dependency-name: "@types/vscode"
        versions: [">1.100.0"]
      - dependency-name: "@types/node"
        versions: [">=21"]
  - package-ecosystem: pip
    directory: /website
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tools/quality
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tools/release
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tests/perf
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /mcp
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /bindings/python
    schedule:
      interval: weekly
